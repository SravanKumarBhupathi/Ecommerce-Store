<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Sarees - Sareeloom</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .shop-layout {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            padding: 2rem 0;
        }

        .sidebar {
            width: 100%;
        }

        .main-content {
            flex-grow: 1;
        }

        .filter-section {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        .filter-title {
            font-size: 1rem;
            margin-bottom: 1rem;
            font-family: var(--font-body);
        }

        .filter-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .shop-header {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .search-bar {
            display: flex;
            gap: 0.5rem;
        }

        .search-input {
            flex-grow: 1;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .sort-select {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--white);
        }

        .mobile-filter-btn {
            display: block;
        }

        .sidebar-drawer {
            display: none;
        }

        @media (min-width: 768px) {
            .shop-layout {
                flex-direction: row;
            }
            .sidebar {
                width: 250px;
                flex-shrink: 0;
            }
            .shop-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
            .mobile-filter-btn {
                display: none;
            }
            .sidebar-drawer {
                display: block;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
            <a href="index.html" class="logo site-name-display">Sareeloom</a>

            <nav class="desktop-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop All</a></li>
                    <li><a href="shop.html?category=Silk Sarees">Silk Sarees</a></li>
                    <li><a href="shop.html?category=Cotton Sarees">Cotton Sarees</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <a href="cart.html" class="icon-btn">
                    🛒
                    <span class="cart-count-badge" style="display: none;">0</span>
                </a>
            </div>
        </div>
    </header>

    <nav class="mobile-nav" id="mobile-nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop All Sarees</a></li>
            <li><a href="cart.html">View Cart</a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="shop-layout">
            <!-- Sidebar / Filters -->
            <aside class="sidebar">
                <button class="btn btn-outline btn-block mobile-filter-btn" id="toggle-filters">Show Filters</button>

                <div class="sidebar-drawer" id="filter-drawer">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; margin-top: 1rem;">
                        <h3 style="margin: 0;">Filters</h3>
                        <button id="clear-filters" style="background: none; border: none; color: var(--primary-color); cursor: pointer; font-size: 0.9rem;">Clear All</button>
                    </div>

                    <div class="filter-section">
                        <h4 class="filter-title">Category</h4>
                        <div class="filter-list" id="filter-category"></div>
                    </div>

                    <div class="filter-section">
                        <h4 class="filter-title">Color</h4>
                        <div class="filter-list" id="filter-color"></div>
                    </div>

                    <div class="filter-section">
                        <h4 class="filter-title">Fabric</h4>
                        <div class="filter-list" id="filter-fabric"></div>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <div class="main-content">
                <div class="shop-header">
                    <div class="search-bar" style="flex-grow: 1; max-width: 400px;">
                        <input type="text" id="search-input" class="search-input" placeholder="Search by name, ID, color...">
                        <button class="btn btn-primary" id="search-btn">Search</button>
                    </div>

                    <div>
                        <select id="sort-select" class="sort-select">
                            <option value="recommended">Recommended</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="newest">Newest</option>
                        </select>
                    </div>
                </div>

                <div id="active-filters" style="margin-bottom: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap;"></div>

                <div id="product-count" style="margin-bottom: 1rem; color: var(--text-muted); font-size: 0.9rem;"></div>

                <div class="product-grid" id="shop-product-grid">
                    <!-- Products rendered by JS -->
                </div>

                <div id="no-results" style="display: none; text-align: center; padding: 3rem 0;">
                    <h3>No sarees found matching your criteria.</h3>
                    <button class="btn btn-primary" style="margin-top: 1rem;" onclick="location.href='shop.html'">Clear Search & Filters</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/products.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/app.js"></script>
    <script src="js/shop.js"></script>
</body>
</html>
