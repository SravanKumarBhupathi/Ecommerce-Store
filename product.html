<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Sareeloom</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .product-layout {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            padding: 2rem 0;
        }

        .product-gallery {
            width: 100%;
        }

        .main-image-container {
            width: 100%;
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .main-image-container img {
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        .thumbnail-list {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            object-fit: cover;
        }

        .thumbnail.active {
            border: 2px solid var(--primary-color);
        }

        .product-details {
            width: 100%;
        }

        .pd-title {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .pd-id {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .pd-price-wrap {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .pd-price {
            font-size: 1.8rem;
            color: var(--primary-color);
            font-weight: 600;
        }

        .pd-original {
            text-decoration: line-through;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .pd-discount {
            background-color: #ffe0b2;
            color: #e65100;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .pd-specs {
            margin-bottom: 1.5rem;
        }

        .pd-spec-item {
            display: flex;
            margin-bottom: 0.5rem;
        }

        .pd-spec-label {
            width: 120px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .pd-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }

        .qty-selector {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: max-content;
        }

        .qty-btn {
            background: none;
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .qty-input {
            width: 40px;
            text-align: center;
            border: none;
            font-size: 1rem;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
        }

        .action-buttons .btn {
            flex: 1;
        }

        .whatsapp-order-btn {
            background-color: #25D366;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .whatsapp-order-btn:hover {
            background-color: #128C7E;
        }

        .pd-description {
            margin-top: 2rem;
            line-height: 1.8;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        @media (min-width: 768px) {
            .product-layout {
                flex-direction: row;
                gap: 4rem;
            }
            .product-gallery {
                width: 50%;
                flex-shrink: 0;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
            <a href="index.html" class="logo site-name-display">Sareeloom</a>

            <nav class="desktop-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop All</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <a href="cart.html" class="icon-btn">
                    🛒
                    <span class="cart-count-badge" style="display: none;">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container" id="product-container">
        <!-- Content injected via JS -->
    </main>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/products.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/whatsapp.js"></script>
    <script src="js/app.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('product-container');
            const productId = utils.getURLParam('id');
            const product = utils.getProductById(productId);

            if (!product) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 5rem 0;">
                        <h2>Product Not Found</h2>
                        <p>The saree you are looking for does not exist or has been removed.</p>
                        <a href="shop.html" class="btn btn-primary" style="margin-top: 1rem;">Back to Shop</a>
                    </div>
                `;
                return;
            }

            // Update page title
            document.title = `${product.name} - ${window.siteConfig.SITE_NAME}`;

            let selectedQty = 1;

            const html = `
                <div style="margin-top: 1rem; font-size: 0.9rem; color: var(--text-muted);">
                    <a href="index.html">Home</a> > <a href="shop.html">Shop</a> > <a href="shop.html?category=${encodeURIComponent(product.category)}">${product.category}</a> > ${product.name}
                </div>

                <div class="product-layout">
                    <div class="product-gallery">
                        <div class="main-image-container">
                            <img id="main-image" src="${product.images[0]}" alt="${product.name}">
                        </div>
                        <div class="thumbnail-list">
                            ${product.images.map((img, idx) => `
                                <img src="${img}" class="thumbnail ${idx === 0 ? 'active' : ''}" onclick="changeImage('${img}', this)" alt="Thumbnail">
                            `).join('')}
                        </div>
                    </div>

                    <div class="product-details">
                        <h1 class="pd-title">${product.name}</h1>
                        <div class="pd-id">Product ID: ${product.id}</div>

                        <div style="margin-bottom: 1rem; color: #f5b041;">
                            ${'★'.repeat(Math.floor(product.rating))}${product.rating % 1 !== 0 ? '½' : ''} <span style="color:var(--text-muted); font-size: 0.9rem;">(${product.reviews} reviews)</span>
                        </div>

                        <div class="pd-price-wrap">
                            <div class="pd-price">${utils.formatCurrency(product.price)}</div>
                            ${product.originalPrice > product.price ? `
                                <div class="pd-original">${utils.formatCurrency(product.originalPrice)}</div>
                                <div class="pd-discount">${product.discount}% OFF</div>
                            ` : ''}
                        </div>

                        <div class="pd-specs">
                            <div class="pd-spec-item">
                                <span class="pd-spec-label">Availability:</span>
                                <span style="color: ${product.stockStatus === 'In Stock' ? 'green' : 'red'}; font-weight: 500;">${product.stockStatus}</span>
                            </div>
                            <div class="pd-spec-item">
                                <span class="pd-spec-label">Category:</span>
                                <span>${product.category}</span>
                            </div>
                            <div class="pd-spec-item">
                                <span class="pd-spec-label">Fabric:</span>
                                <span>${product.fabric}</span>
                            </div>
                            <div class="pd-spec-item">
                                <span class="pd-spec-label">Color:</span>
                                <span>${product.color}</span>
                            </div>
                            <div class="pd-spec-item">
                                <span class="pd-spec-label">Pattern:</span>
                                <span>${product.pattern}</span>
                            </div>
                            <div class="pd-spec-item">
                                <span class="pd-spec-label">Blouse:</span>
                                <span>${product.blouseIncluded ? 'Unstitched Blouse Piece Included' : 'No Blouse Piece'}</span>
                            </div>
                        </div>

                        <div class="pd-actions">
                            <div class="qty-selector">
                                <button class="qty-btn" id="qty-minus">-</button>
                                <input type="number" class="qty-input" id="qty-input" value="1" min="1" readonly>
                                <button class="qty-btn" id="qty-plus">+</button>
                            </div>

                            <div class="action-buttons">
                                <button class="btn btn-outline" id="add-to-cart-btn">Add to Cart</button>
                                <button class="btn btn-primary" id="buy-now-btn">Buy Now</button>
                            </div>

                            <button class="btn whatsapp-order-btn" id="direct-whatsapp-btn" style="width: 100%;">
                                📱 Order This Saree on WhatsApp
                            </button>
                        </div>

                        <div class="pd-description">
                            <h3>Product Description</h3>
                            <p style="margin-top: 1rem; color: var(--text-muted);">${product.description}</p>
                        </div>
                    </div>
                </div>
            `;

            container.innerHTML = html;

            // Setup interactions
            const qtyInput = document.getElementById('qty-input');

            document.getElementById('qty-minus').addEventListener('click', () => {
                if (selectedQty > 1) {
                    selectedQty--;
                    qtyInput.value = selectedQty;
                }
            });

            document.getElementById('qty-plus').addEventListener('click', () => {
                selectedQty++;
                qtyInput.value = selectedQty;
            });

            document.getElementById('add-to-cart-btn').addEventListener('click', () => {
                cartManager.addToCart(product, selectedQty);
            });

            document.getElementById('buy-now-btn').addEventListener('click', () => {
                cartManager.addToCart(product, selectedQty);
                window.location.href = 'checkout.html';
            });

            document.getElementById('direct-whatsapp-btn').addEventListener('click', () => {
                const msg = whatsappManager.generateDirectProductMessage(product, selectedQty);
                whatsappManager.openWhatsApp(msg);
            });

            window.changeImage = function(src, el) {
                document.getElementById('main-image').src = src;
                document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
                el.classList.add('active');
            };
        });
    </script>
</body>
</html>
